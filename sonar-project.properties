sonar.projectKey=btpn-syariah-sonarqube-security-demo
sonar.projectName=BTPN Syariah - SonarQube Security Demo
sonar.sourceEncoding=UTF-8
sonar.sources=src
sonar.tests=test
# Keep test files disjoint from main files even if someone overrides
# sonar.sources with '.' on the scanner command line.
sonar.exclusions=coverage/**,reports/**,test/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Requires SonarQube Server Enterprise + Advanced Security with SCA enabled.
sonar.sca.enabled=true
